<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00523c">
    <title>ViveADN</title>
    <style>
      /* Pantalla de inicio: se pinta antes de que cargue cualquier script */
      html, body { margin: 0; background: #00523c; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #00523c; color: #f4f0e6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        transition: opacity .45s ease, visibility .45s ease;
      }
      #splash.salida { opacity: 0; visibility: hidden; }
      #splash svg { width: 96px; height: 96px; overflow: visible; }
      #splash .hebra { stroke-dasharray: 140; stroke-dashoffset: 140; animation: trazo 1.2s ease-out forwards; }
      #splash .hebra.b { animation-delay: .15s; }
      #splash .peldano { opacity: 0; animation: aparece .5s ease-out forwards; animation-delay: .9s; }
      #splash .nombre { font-size: 30px; font-weight: 800; letter-spacing: .01em; opacity: 0; animation: sube .6s ease-out .35s forwards; }
      #splash .nombre b { color: #f5a623; font-weight: 800; }
      #splash .lema { font-size: 14px; opacity: 0; animation: sube .6s ease-out .55s forwards; color: #d9d3c0; }
      #splash .carga { position: absolute; bottom: calc(48px + env(safe-area-inset-bottom)); width: 40px; height: 3px; border-radius: 3px; background: rgba(244,240,230,.2); overflow: hidden; }
      #splash .carga::after { content: ""; display: block; width: 40%; height: 100%; background: #f5a623; border-radius: 3px; animation: barra 1.1s ease-in-out infinite; }
      @keyframes trazo { to { stroke-dashoffset: 0; } }
      @keyframes aparece { to { opacity: 1; } }
      @keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes barra { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: none !important; }
        #splash .hebra { stroke-dashoffset: 0; } #splash .peldano, #splash .nombre, #splash .lema { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando ViveADN">
      <!-- Marca: dos hebras que se cruzan (ADN) con peldaños dorados -->
      <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <g class="peldano" stroke="#f5a623" stroke-width="3" stroke-linecap="round">
          <line x1="34" y1="22" x2="62" y2="22"/>
          <line x1="30" y1="36" x2="66" y2="36"/>
          <line x1="30" y1="60" x2="66" y2="60"/>
          <line x1="34" y1="74" x2="62" y2="74"/>
        </g>
        <path class="hebra a" d="M30 8 C30 34, 66 38, 66 48 C66 58, 30 62, 30 88" stroke="#f4f0e6" stroke-width="5" stroke-linecap="round"/>
        <path class="hebra b" d="M66 8 C66 34, 30 38, 30 48 C30 58, 66 62, 66 88" stroke="#0b7a58" stroke-width="5" stroke-linecap="round" style="stroke:#f4f0e6;stroke-opacity:.55"/>
      </svg>
      <div class="nombre">Vive<b>ADN</b></div>
      <div class="lema">Cada persona cuenta</div>
      <div class="carga" aria-hidden="true"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
